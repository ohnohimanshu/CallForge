x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TELEPHONY_HOST: 0.0.0.0
  TELEPHONY_PORT: "9092"
  TELEPHONY_MAX_CONCURRENT_CALLS: "${TELEPHONY_MAX_CONCURRENT_CALLS:-4}"
  API_HOST: 0.0.0.0
  API_PORT: "8080"
  VAD_MIN_SILENCE_MS: "${VAD_MIN_SILENCE_MS:-380}"
  VAD_PRE_SPEECH_PADDING_MS: "${VAD_PRE_SPEECH_PADDING_MS:-220}"
  STT_MODEL_SIZE: "${STT_MODEL_SIZE:-base}"
  STT_DEVICE: "${STT_DEVICE:-cpu}"
  STT_COMPUTE_TYPE: "${STT_COMPUTE_TYPE:-int8}"
  STT_BEAM_SIZE: "${STT_BEAM_SIZE:-1}"
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: "${LLM_MODEL:-llama3.2:3b-instruct-q4_K_M}"
  LLM_NUM_PREDICT: "${LLM_NUM_PREDICT:-110}"
  TTS_VOICE_MODEL_PATH: "${TTS_VOICE_MODEL_PATH:-/models/piper/en_US-amy-medium.onnx}"
  TTS_VOICE_MODEL_PATH_HI: "${TTS_VOICE_MODEL_PATH_HI:-/models/piper/hi_IN-priyamvada-medium.onnx}"
  # Host that FreePBX uses to reach CallForge AudioSocket (set to this machine's LAN IP)
  AUDIOSOCKET_HOST: ${AUDIOSOCKET_HOST:-voice-agent}
  FREEPBX_AUDIOSOCKET_HOST: ${FREEPBX_AUDIOSOCKET_HOST:-}
  FREEPBX_API_BASE: ${FREEPBX_API_BASE:-}
  CALLFORGE_PUBLIC_URL: ${CALLFORGE_PUBLIC_URL:-}
  # Optional legacy Asterisk AMI (only when profile legacy-asterisk is enabled)
  ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST:-asterisk-pbx}
  ASTERISK_AMI_PORT: "5038"
  ASTERISK_SPOOL_DIR: /app/platform_data/outgoing

# Default stack: CallForge AI + Ollama. FreePBX (external) connects via Direct AudioSocket.
# Start: docker compose up -d
#
# Optional embedded Asterisk (NOT recommended when you have FreePBX):
#   docker compose --profile legacy-asterisk up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: voice-agent-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - voice-agent-net
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: voice-agent-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - voice-agent-net
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service to be ready..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling LLM model (${LLM_MODEL:-llama3.2:3b-instruct-q4_K_M})..."
        ollama pull ${LLM_MODEL:-llama3.2:3b-instruct-q4_K_M} || true
        echo "Pulling Embedding model (nomic-embed-text)..."
        ollama pull nomic-embed-text || true
        echo "Ollama initialization complete. Available models:"
        ollama list
    environment:
      OLLAMA_HOST: ollama:11434

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-app
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - ./models:/models:ro
      - ./platform_data:/app/platform_data
      - ./chroma_data:/app/chroma_data
      - ./asterisk-server:/app/asterisk-server
      - whisper-cache:/home/voiceagent/.cache
    ports:
      # Web UI + FreePBX session/handoff API
      - "8080:8080"
      # FreePBX Method 1: Direct AudioSocket (raw 8kHz PCM over TCP)
      - "9092-9101:9092-9101"
    networks:
      - voice-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # FreePBX Telephony Server & MariaDB Database
  # Handles all SIP extensions, physical IP phones, trunks, and call routing.
  # Web GUI is bound to 127.0.0.1 so it cannot be accessed directly by raw IP.
  # ---------------------------------------------------------------------------
  freepbx-db:
    profiles: ["embedded-freepbx"]
    image: tiredofit/mariadb:latest
    container_name: freepbx-db
    restart: unless-stopped
    volumes:
      - freepbx-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${FREEPBX_DB_ROOT_PASS:-callforge_db_root_pass}
      - MYSQL_DATABASE=asterisk
      - MYSQL_USER=asterisk
      - MYSQL_PASSWORD=${FREEPBX_DB_PASS:-callforge_asterisk_pass}
    networks:
      - voice-agent-net

  freepbx:
    profiles: ["embedded-freepbx"]
    image: tiredofit/freepbx:latest
    container_name: freepbx-app
    restart: unless-stopped
    depends_on:
      - freepbx-db
    ports:
      # FreePBX Web GUI bound ONLY to localhost (127.0.0.1) so users cannot access it by just entering raw IP
      - "127.0.0.1:${FREEPBX_WEB_PORT:-8088}:80"
      # SIP signaling & PJSIP for IP desk phones and softphones
      - "5060:5060/udp"
      - "5160:5160/udp"
      # RTP Audio streaming range
      - "18000-18100:18000-18100/udp"
    volumes:
      - ./platform_data/freepbx_data:/data
      - ./platform_data/freepbx_logs:/var/log
    environment:
      - RTP_START=18000
      - RTP_FINISH=18100
      - DB_EMBEDDED=FALSE
      - DB_HOST=freepbx-db
      - DB_PORT=3306
      - DB_NAME=asterisk
      - DB_USER=asterisk
      - DB_PASS=${FREEPBX_DB_PASS:-callforge_asterisk_pass}
      - ENABLE_FAIL2BAN=FALSE
    networks:
      - voice-agent-net

networks:
  voice-agent-net:
    driver: bridge

volumes:
  ollama-models:
  whisper-cache:
  freepbx-db-data:
