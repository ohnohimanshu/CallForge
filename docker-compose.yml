x-app-env: &app-env
  LOG_LEVEL: INFO
  TELEPHONY_HOST: 0.0.0.0
  TELEPHONY_PORT: "9092"
  TELEPHONY_MAX_CONCURRENT_CALLS: "2"
  API_HOST: 0.0.0.0
  API_PORT: "8080"
  VAD_MIN_SILENCE_MS: "500"
  VAD_PRE_SPEECH_PADDING_MS: "300"
  STT_MODEL_SIZE: small
  STT_DEVICE: cpu
  STT_COMPUTE_TYPE: int8
  STT_BEAM_SIZE: "1"
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: llama3.2:3b-instruct-q4_K_M
  LLM_NUM_PREDICT: "110"
  TTS_VOICE_MODEL_PATH: /models/piper/en_US-amy-medium.onnx
  TTS_VOICE_MODEL_PATH_HI: /models/piper/hi_IN-priyamvada-medium.onnx
  AUDIOSOCKET_HOST: voice-agent
  ASTERISK_AMI_HOST: asterisk-pbx
  ASTERISK_AMI_PORT: "5038"
  ASTERISK_SPOOL_DIR: /app/platform_data/outgoing

# Unified single-command stack: Asterisk PBX, Ollama LLM, CallForge Web UI & Audio Pipeline.
# Start with: docker compose up -d

services:
  asterisk-pbx:
    image: andrius/asterisk:latest
    container_name: asterisk-pbx
    restart: unless-stopped
    volumes:
      - ./asterisk-server:/etc/asterisk
      - ./platform_data/outgoing:/var/spool/asterisk/outgoing
    ports:
      - "5060:5060/udp"
      - "5038:5038/tcp"
      - "10000-10100:10000-10100/udp"
    networks:
      - voice-agent-net
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    container_name: voice-agent-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - voice-agent-net
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: voice-agent-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - voice-agent-net
    entrypoint: ["sh", "-c"]
    command:
      - |
        ollama pull llama3.2:3b-instruct-q4_K_M || true
        ollama pull nomic-embed-text || true
        curl -s http://ollama:11434/api/tags
    environment:
      OLLAMA_HOST: ollama:11434

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-app
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
      asterisk-pbx:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./models:/models:ro
      - ./platform_data:/app/platform_data
      - ./chroma_data:/app/chroma_data
      - ./asterisk-server:/app/asterisk-server
      - whisper-cache:/home/voiceagent/.cache
    ports:
      - "8080:8080"
      - "9092-9101:9092-9101"
    networks:
      - voice-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2.5G

networks:
  voice-agent-net:
    driver: bridge

volumes:
  ollama-models:
  whisper-cache:
