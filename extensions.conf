[general]
static=yes
writeprotect=no

#include asterisk-server/extensions_agents.conf

[from-external]
exten => _+X.,1,Goto(from-internal,${EXTEN},1)
exten => _X.,1,Goto(from-internal,${EXTEN},1)
exten => s,1,Goto(from-internal,2000,1)

[internal]
exten => _+X.,1,Goto(from-internal,${EXTEN},1)
exten => _X.,1,Goto(from-internal,${EXTEN},1)
exten => s,1,Goto(from-internal,2000,1)

[from-internal]
exten => 2000,1,NoOp(Fallback — deploy an agent from the CallForge UI)
 same => n,Answer()
 same => n,Playback(tt-somethingwrong)
 same => n,Hangup()
