[general]
static=yes
writeprotect=no

; ---------------------------------------------------------------------------
; from-external: unauthenticated / anonymous inbound SIP
; Anyone dialing sip:<ext>@server lands here, then jumps to [internal].
; ---------------------------------------------------------------------------
[from-external]
exten => _+X.,1,NoOp(Anonymous/inbound call to ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(from-internal,${EXTEN},1)

exten => _X.,1,NoOp(Anonymous/inbound call to ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(from-internal,${EXTEN},1)

exten => s,1,NoOp(Anonymous call with no extension — route to default agent 2000)
 same => n,Goto(from-internal,2000,1)

include => from-internal
include => internal

[internal]
include => from-internal

; Default / empty dialed extension -> route to AI agent 2000
exten => s,1,Goto(from-internal,2000,1)

; Softphone ↔ softphone (optional lab extensions)
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 101,1,Goto(internal,1001,1)

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

exten => 102,1,Goto(internal,1002,1)

exten => 1003,1,Dial(PJSIP/1003,20)
 same => n,Hangup()

exten => 103,1,Goto(internal,1003,1)

exten => 1004,1,Dial(PJSIP/1004,20)
 same => n,Hangup()

exten => 104,1,Goto(internal,1004,1)

exten => 200,1,Goto(from-internal,2000,1)

exten => guest,1,Dial(PJSIP/guest,20)
 same => n,Hangup()


; Deployed AI agents (CallForge regenerates this on deploy/undeploy)
#include extensions_agents.conf
