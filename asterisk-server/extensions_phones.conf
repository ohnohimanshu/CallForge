; AUTO-GENERATED by CallForge Telephony Server — do not edit by hand.
; Dynamic dialplan for internal extension-to-extension calling and intercom.
; Reload with: asterisk -rx "dialplan reload"

[from-internal-phones]
; Audio Echo & Microphone Latency Test
exten => *43,1,NoOp(Echo Audio Test requested by ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(0.4)
 same => n,Playback(demo-echodone,noanswer)
 same => n,Echo()
 same => n,Hangup()

exten => 9999,1,Goto(from-internal-phones,*43,1)

; Conference Bridge: Dial 8888 to join group conversation with other phones
exten => 8888,1,NoOp(Conference Bridge 8888 joined by ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,ConfBridge(8888)
 same => n,Hangup()

; Broadcast Ring All Phones: Dial 8000 to ring every configured phone simultaneously
exten => 8000,1,NoOp(Broadcast Ring All Phones by ${CALLERID(all)})
 same => n,Dial(PJSIP/1001&PJSIP/1002&PJSIP/1003&PJSIP/1004&PJSIP/1005&PJSIP/1006&PJSIP/1007&PJSIP/1008&PJSIP/1009&PJSIP/1010&PJSIP/1011&PJSIP/1012&PJSIP/1013&PJSIP/1014,30,tTr)
 same => n,Hangup()

; Direct Call: Extension 1001 (Himanshu Mobile)
exten => 1001,1,NoOp(Internal call to Extension 1001 [Himanshu Mobile] from ${CALLERID(all)})
 same => n,Set(__CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Dial(PJSIP/1001,30,tTr)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
 same => n(busy),Playtones(busy)
 same => n,Busy(3)
 same => n,Hangup()
 same => n(unavail),Playtones(congestion)
 same => n,Congestion(3)
 same => n,Hangup()

