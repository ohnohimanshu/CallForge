[global]
type=global
; Prefer IP match, then username, then anonymous for unauthenticated INVITEs.
; This lets ANY SIP client call your AI agents without a per-phone PJSIP entry.
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------------
; Shared GUEST endpoint — anyone can REGISTER as guest / guestpass123
; (no need to add each mobile/softphone to this file).
; ---------------------------------------------------------------------------
[guest]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
auth=guest
aors=guest
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[guest]
type=auth
auth_type=userpass
username=guest
password=guestpass123

[guest]
type=aor
max_contacts=50
remove_existing=no
qualify_frequency=60

; ---------------------------------------------------------------------------
; Anonymous / unauthenticated inbound INVITEs (no REGISTER required).
; Softphones and trunks can dial sip:<extension>@<server-ip> directly.
; Tighten with ACL / identify match= in production.
; ---------------------------------------------------------------------------
[anonymous]
type=endpoint
context=from-external
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ---------------------------------------------------------------------------
; Dynamic IP Phones & Mobile Softphones (managed by CallForge Telephony Server)
; ---------------------------------------------------------------------------
#include pjsip_phones.conf

